# Text for the generated reference pages that needs a person.
#
# The generators merge this file into docs/reference/*.md, so edit here and
# never edit those pages. Then run scripts/docs/check.sh, or one generator:
#
#   uv run -q --no-project --python 3.12 --with pyyaml python scripts/docs/gen_env.py
#
# Each section takes optional `intro` and `outro` Markdown, placed before and
# after the generated tables, and `entries` keyed by the name in the code. An
# entry is a string, or a mapping with `description` and, for environment
# variables, `default` to replace the value parsed from the code. A key the
# code no longer has fails the generator. A missing description shows as
# TODO(verify).

environment:
  intro: |
    `common/settings.py` loads a `.env` file with `dotenv.load_dotenv()` when it is imported, so values in `.env` count as environment variables. Every read below sits under `api/`, `common/` or `conserver/`. Tests are left out.

    A default of `none` means the read returns nothing when the variable is unset. `required` means the code raises `KeyError` when it is unset. A variable set to an empty value counts as set, so its default does not apply.

    Each process reads these values when it starts, so restart it after a change. For help choosing values, see the [environment guide](../configuration/environment-variables.md).
  outro: |
    The dynamic read in `groq_whisper` does not configure anything. When that link module loads, it deletes `HTTP_PROXY`, `HTTPS_PROXY`, `NO_PROXY` and their lowercase forms from the process environment.

    ## Variables outside the server code

    Scripts, Docker Compose and the OpenTelemetry tools read these. The table above leaves them out because no code under `api/`, `common/` or `conserver/` reads them.

    | Variable | Read by | Default | Description |
    |---|---|---|---|
    | `COMPOSE_PROFILES` | Docker Compose | none | Comma-separated profiles to start: `postgres`, `elasticsearch`, `langfuse`. |
    | `CONSERVER_EXTERNAL_PORT` | `docker-compose.yml` | `8000` | Host port published for the `api` service. |
    | `OTEL_EXPORTER_OTLP_HEADERS` | `opentelemetry-instrument` | empty | Headers for OTLP export. Compose passes it to `api` and `conserver`. |
    | `OTEL_EXPORTER_OTLP_INSECURE` | `opentelemetry-instrument` | `false` in Compose | Turns off TLS for OTLP export. Compose passes it to `api` and `conserver`. |
    | `OTEL_EXPORTER_OTLP_PROTOCOL` | `opentelemetry-instrument` | `grpc` in Compose | OTLP protocol. The custom metrics in `common/lib/metrics.py` always use the gRPC exporter, whatever this says. |
    | `OTEL_RESOURCE_ATTRIBUTES` | `opentelemetry-instrument` | `deployment.environment=dev` in Compose | Resource attributes. The Compose file fixes this value for `api` and `conserver`. |
    | `REDIS_MIGRATION_SOURCE_URL` | `scripts/migrate_redis_json.py` | required | Redis URL to copy from. See the [Redis migration](../installation/redis-migration.md). |
    | `REDIS_MIGRATION_TARGET_URL` | `scripts/migrate_redis_json.py` | required | Redis URL to copy to. |
  entries:
    API_ROOT_PATH: FastAPI `root_path` for the API app, for a proxy that strips this prefix. Route paths do not change.
    CONSERVER_API_TOKEN: One API key for the main API routes. With neither this nor `CONSERVER_API_TOKEN_FILE` set, the API skips authentication on those routes.
    CONSERVER_API_TOKEN_FILE: Path to a file of API keys, one per line, read once when the API starts. Added to the keys from `CONSERVER_API_TOKEN`.
    CONSERVER_CONFIG_FILE: Path to the YAML configuration. `common/config.py` reads it through the setting and its default. The `POST /config` handler reads the variable directly, with no default, to write the file. An empty value fails when the file is opened.
    CONSERVER_HEADER_NAME: HTTP header that carries the API key. The follower also sends its auth token in this header.
    CONSERVER_PARALLEL_STORAGE: When true, and a chain has more than one storage backend, writes run in parallel. `true`, `1` and `yes` count as true, in any case.
    CONSERVER_START_METHOD: Multiprocessing start method, one of `fork`, `spawn` or `forkserver`. Used only when `CONSERVER_WORKERS` is above 1. Empty or unset uses the Python platform default. Any other value raises `ValueError` at startup.
    CONSERVER_VCON_CONCURRENCY: In-flight vCons per worker process. Values under 1 become 1, which processes vCons serially.
    CONSERVER_WORKERS: Number of worker processes. Values under 1 become 1.
    DEEPGRAM_KEY: Read into `settings`, but no code uses that setting. The `deepgram_link` link takes its key from link options.
    EGRESS_FORMAT_VERSION: Legacy vCon version string emitted by the `webhook` link, the `postgres`, `s3` and `elasticsearch` storage adapters and the `GET /vcon/{uuid}` and `GET /vcons` reads. `0.0.1` is the only supported value. Empty or unset emits the current spec. Redis and link processing stay on the current spec either way.
    ENV: Sentry environment name. The `settings` value is unused. `common/lib/error_tracking.py` reads the variable directly when `SENTRY_DSN` is set, and has no default.
    GROQ_API_KEY: Default `API_KEY` option for the `groq_whisper` link.
    HOSTNAME: Read into `settings`, but no code uses that setting.
    LOG_LEVEL: Read into `settings`, but no code uses that setting. The logging config file sets log levels.
    LOGGING_CONFIG_FILE:
      description: Path passed to `logging.config.fileConfig`. The repo also ships `common/logging_dev.conf`.
      default: "`logging.conf` beside `common/settings.py`"
    OPENAI_API_KEY: Default `OPENAI_API_KEY` option for the `detect_engagement` link. The `settings` value is unused. Other links take the key from link options.
    OTEL_EXPORTER_OTLP_ENDPOINT: OTLP endpoint for metrics, passed to the gRPC exporter in `common/lib/metrics.py`. Unset or empty, the metric helpers do nothing.
    OTEL_METRIC_EXPORT_INTERVAL: Metric export interval in milliseconds.
    OTEL_SERVICE_NAME: Value of the `service.name` resource attribute on metrics. The Compose file sets `conserver` and `api`.
    REDIS_URL: Redis connection URL. `docker/wait_for_redis.sh` reads it too, and skips its wait when it is unset or empty.
    SENTRY_DSN:
      description: Sentry DSN. Unset, Sentry stays off. Set, `ENV` must be in the process environment too.
      default: none
    SXT_API_KEY: Space and Time API key for the `spaceandtime` storage adapter.
    SXT_VCON_TABLENAME: Table name for the `spaceandtime` storage adapter.
    SXT_VCON_TABLE_WRITE_BISCUI: Write biscuit for the `spaceandtime` storage adapter. The code reads this exact name, which lacks the final `T` of the Python constant `SXT_VCON_TABLE_WRITE_BISCUIT`.
    TICK_INTERVAL: Read into `settings`, but no code uses that setting.
    UUID8_DOMAIN_NAME:
      description: Read into a constant in `common/vcon.py`, but no code uses that constant.
      default: a domain set in code
    VCON_CONTEXT_EXPIRY: Seconds before ingress context data expires in Redis.
    VCON_DLQ_EXPIRY: TTL in seconds for a vCon in a dead letter queue. The ingress DLQ sets the TTL to this value. The storage DLQ only raises a lower TTL. `0` leaves the existing TTL alone.
    VCON_INDEX_EXPIRY: Seconds before the search index keys written by the API expire.
    VCON_REDIS_EXPIRY: TTL in seconds on vCon keys written by `POST /vcon` and `POST /vcon/external-ingress`, and on a vCon cached back from a storage backend.
    VCON_SERVER_BUILD_TIME: Image build time. The Dockerfiles set it from a build argument.
    VCON_SERVER_GIT_COMMIT: Git commit of the build. The Dockerfiles set it from a build argument. Sentry uses it as the release.
    VCON_SERVER_VERSION: Server version string. The Dockerfiles set it from a build argument.
    VCON_SORTED_FORCE_RESET: Read into `settings`, but no code uses that setting.
    VCON_SORTED_SET_NAME: Name of the Redis sorted set that orders vCons by timestamp.
    VCON_STORAGE: PostgreSQL connection string. When set, `api/api.py` defines a Peewee model on it, but no code uses that model.
    VCON_STORAGE_FALLBACK_ENABLED: When true, a Redis miss in `VconRedis.get_vcon` tries the configured storage backends and caches the first hit back in Redis. `true`, `1` and `yes` count as true, in any case.
    WEVIATE_API_KEY: Read into `settings`, but no code uses that setting. The spelling is the one in the code.
    WEVIATE_HOST: Read into `settings`, but no code uses that setting. The spelling is the one in the code.

ports:
  intro: |
    `docker-compose.yml` joins every service to the `conserver` network, which is declared external, so create it before the first `docker compose up`. Set `COMPOSE_PROFILES` in `.env` to start optional services. A service with no published port is reachable only on that network.
  entries:
    api: FastAPI app, run by uvicorn on port 8000.
    conserver: Runs `conserver/main.py`, restarted by `watchmedo` when a Python file changes. Publishes no port.
    elasticsearch: Single-node Elasticsearch with security on. The credentials in the Compose file are for development only.
    langfuse-clickhouse: ClickHouse store for Langfuse. Uses 8123 and 9000 on the network.
    langfuse-minio: MinIO object store for Langfuse. Uses 9000 on the network, with its console on 9001.
    langfuse-postgres: PostgreSQL database for Langfuse. Uses 5432 on the network.
    langfuse-server: Langfuse web app for local tracing. The credentials in the Compose file are for development only.
    langfuse-worker: Langfuse background worker.
    postgres: Local PostgreSQL. The credentials in the Compose file are for development only.
    redis: Plain Redis with append-only persistence and a 1 GB memory limit. Uses 6379 on the network.
  outro: |
    ## Container and port map

    ![Docker host ports, the conserver network and the Compose services by profile](../diagrams/D02-container-port-map.svg)

routes:
  intro: |
    Paths are relative to the app. `API_ROOT_PATH`, default `/api`, sets the FastAPI root path.

    The Auth column uses three values:

    - `API key` routes pass through `get_api_key`, which compares the header named by `CONSERVER_HEADER_NAME` with the keys from `CONSERVER_API_TOKEN` and `CONSERVER_API_TOKEN_FILE`. With no keys configured, the check is skipped and the route is open.
    - `ingress API key` routes call `validate_ingress_api_key`, which checks the same header against the `ingress_auth` section of the configuration for the named ingress list. With no match the API returns 403, including when `ingress_auth` is empty.
    - `none` routes have no check.
  outro: |
    `FastAPI` is created without turning off its default pages, so `/docs`, `/redoc` and `/openapi.json` are served too, with no check.
  entries:
    "GET /vcon/egress": Declared 204. The handler returns a JSON array with 200.
    "GET /vcon/count": "Unreachable. `GET /vcon/{vcon_uuid}` captures the path and returns 422."

metrics:
  intro: |
    All metrics go through the helpers in `common/lib/metrics.py`. They publish only when `OTEL_EXPORTER_OTLP_ENDPOINT` is set, and always through the OTLP gRPC exporter. `OTEL_METRIC_EXPORT_INTERVAL` sets the export interval. Metrics from OpenTelemetry auto-instrumentation are not listed.
  entries:
    conserver.api.count_vcons_enqueued: vCons the API added to an ingress list. Attributes are `ingress_list` and `source`, which is `new`, `external`, `reingress` or `dlq_reprocess`.
    conserver.dlq.count: vCons moved to a dead letter queue, ingress or storage. Attribute is `queue_name`.
    conserver.ingress_list.length: Current `LLEN` of each configured ingress list and its dead letter queue. Attributes are `ingress_list` and `kind`, which is `ingress` or `dlq`.
    conserver.lib.vcon_redis.get_vcon_not_found: A `VconRedis.get_vcon` call found the vCon in neither Redis nor storage.
    conserver.lib.vcon_redis.get_vcon_redis_miss: A `VconRedis.get_vcon` call missed Redis.
    conserver.lib.vcon_redis.get_vcon_storage_hit: A `VconRedis.get_vcon` call missed Redis and found the vCon in storage.
    conserver.link.count: Link runs. Attributes are `link_name` and `outcome`, which is `success`, `halt` or `error`.
    conserver.link.datatrails.event_creation_failures: Failed DataTrails event creation.
    conserver.link.deepgram.confidence: Deepgram transcript confidence. Not recorded when the link goes through a LiteLLM proxy.
    conserver.link.deepgram.transcription_failures: Failed Deepgram transcriptions, including results below `minimum_confidence`.
    conserver.link.deepgram.transcription_time: Deepgram transcription time in seconds.
    conserver.link.diet.media_post_failures: Failed media posts from the `diet` link.
    conserver.link.execution_time: Link execution time in seconds. Attributes are `link.name` and `chain.name`.
    conserver.link.groq_whisper.transcription_failures: Failed Groq Whisper transcriptions.
    conserver.link.groq_whisper.transcription_time: Groq Whisper transcription time in seconds.
    conserver.link.hugging_face_whisper.transcription_failures: Failed Hugging Face Whisper transcriptions.
    conserver.link.hugging_face_whisper.transcription_time: Hugging Face Whisper transcription time in seconds.
    conserver.link.huggingface.llm_failures: Failed Hugging Face LLM calls.
    conserver.link.huggingface.llm_time: Hugging Face LLM call time in seconds.
    conserver.link.jq.filter_errors: Errors applying the `jq_link` filter.
    conserver.link.jq.string_body_array_retries: Filter retries with string-only body arrays after a type error.
    conserver.link.jq.vcon_filtered_out: vCons the `jq_link` filter stopped.
    conserver.link.openai.analysis_failures: Failed analysis calls in the `analyze`, `analyze_and_label` and `analyze_vcon` links.
    conserver.link.openai.analysis_time: Analysis call time in seconds in the `analyze`, `analyze_and_label` and `analyze_vcon` links.
    conserver.link.openai.engagement_analysis_failures: Failed `detect_engagement` analysis calls.
    conserver.link.openai.engagement_analysis_time: "`detect_engagement` analysis time in seconds."
    conserver.link.openai.engagement_detected: Conversations `detect_engagement` found engaged. Other results add 0.
    conserver.link.openai.evaluation_failures: Failed `check_and_tag` evaluations.
    conserver.link.openai.evaluation_time: "`check_and_tag` evaluation time in seconds."
    conserver.link.openai.invalid_json: Invalid JSON responses in `analyze_vcon`.
    conserver.link.openai.json_parse_failures: Responses `analyze_and_label` could not parse as JSON.
    conserver.link.openai.labels_added: Labels `analyze_and_label` added as tags.
    conserver.link.openai.tags_applied: Tags `check_and_tag` applied.
    conserver.link.openai.transcription_failures: Failed `openai_transcribe` transcriptions.
    conserver.link.openai.transcription_time: "`openai_transcribe` transcription time in seconds."
    conserver.link.sampler.sampled_in: vCons the `sampler` link kept.
    conserver.link.sampler.sampled_out: vCons the `sampler` link dropped.
    conserver.link.scitt.registration_failures: Failed SCITT statement registrations.
    conserver.link.scitt.statement_creation_failures: Failed SCITT signed statement creation.
    conserver.link.slack.fallback_channel_used: Posts that failed on the target channel. The link then sends a notice to `default_channel_name` and raises.
    conserver.link.slack.post_failures: Failed Slack posts.
    conserver.link.tag_router.routed_count: vCons routed to at least one list.
    conserver.link.tag_router.routes_matched: Tag matches, one per target list. The `route` attribute names the list.
    conserver.link.webhook.no_urls_configured: Webhook link runs with no URLs configured.
    conserver.link.webhook.post_failures: Webhook link posts that raised an exception.
    conserver.main_loop.count_vcons_processed: vCons that left a chain without an exception, including those a link halted. Attribute is `chain.name`.
    conserver.main_loop.count_vcons_received: vCons popped from an ingress list. Attribute is `ingress_list`.
    conserver.main_loop.vcon_processing_time: Chain processing time in seconds, per vCon that left a chain without an exception, including those a link halted. Attribute is `chain.name`.
    conserver.redis.memory_used_bytes: Redis `used_memory` from `INFO memory`, in bytes.
    conserver.storage.count: Storage writes. Attributes are `backend` and `outcome`, which is `success` or `error`.
    conserver.storage.duration_ms: Storage write time in milliseconds. Attributes are `backend` and `outcome`.
    conserver.storage.milvus.embedding_failures: Failed embedding calls in the `milvus` adapter.
    conserver.storage.milvus.embedding_time: Embedding call time in seconds in the `milvus` adapter.
    conserver.storage.milvus.storage_failures: Failed `milvus` writes.
    conserver.storage.milvus.text_extraction_time: Text extraction time in seconds in the `milvus` adapter.
    conserver.storage.milvus.vcons_stored: vCons written to Milvus.
    conserver.vcons.inflight: vCons in progress. Attribute is `chain.name`.
    conserver.webhook.duration: Webhook storage adapter post time in seconds. Attribute is `status_code`.
